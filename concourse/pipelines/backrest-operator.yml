---
# Source pipeline (no Slack hooks). Hooks injected from Reactive-Network/ci via render-and-validate.

resources:
  - name: ci-shared
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/ci.git
      branch: master
      paths:
        - concourse/
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    check_every: 1m

  - name: app-git
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/backrest-operator.git
      branch: master
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    webhook_token: ((webhook-token-backrest-operator))
    check_every: 1m

  - name: app-git-concourse
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/backrest-operator.git
      branch: master
      paths:
        - concourse/**
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    webhook_token: ((webhook-token-backrest-operator))
    check_every: 1m

  - name: app-git-tags
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/backrest-operator.git
      tag_filter: "v*"
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    webhook_token: ((webhook-token-backrest-operator-tags))
    check_every: 1m

  - name: builder-image
    type: registry-image
    source:
      repository: ghcr.io/reactive-network/ci-image
      tag: builder-1d296957
      username: ((ghcr-credentials.username))
      password: ((ghcr-credentials.password))

  - name: deployer-image
    type: registry-image
    source:
      repository: ghcr.io/reactive-network/ci-image
      tag: deployer-14da7d57
      username: ((ghcr-credentials.username))
      password: ((ghcr-credentials.password))

serial_groups:
  - deploy

groups:
  - name: meta
    jobs:
      - set-self
  - name: ci
    jobs:
      - unit-test
      - helm-lint
      - build-images
      - deploy-ci
  - name: release-flow
    jobs:
      - release
      - release-manual

jobs:
  - name: set-self
    plan:
      - in_parallel:
          - get: app-git-concourse
            trigger: true
          - get: ci-shared
            trigger: true
      - task: render-and-validate
        file: ci-shared/concourse/tasks/render-and-validate.yml
        input_mapping:
          pipeline-src: app-git-concourse
          ci-shared: ci-shared
        output_mapping:
          rendered: rendered
        params:
          PIPELINE_NAME: backrest-operator
          PIPELINE_SRC_PATH: pipeline-src/concourse/pipelines/backrest-operator.yml
          VARS_FILE: pipeline-src/concourse/vars/sample.yml
          CI_RESOURCE: ci-shared
      - set_pipeline: self
        file: rendered/pipeline.yml

  - name: unit-test
    plan:
      - in_parallel:
          steps:
            - get: app-git
              trigger: true
            - get: ci-shared
              passed: [set-self]
            - get: builder-image
      - task: unit-test
        image: builder-image
        file: app-git/concourse/tasks/unit-test.yml
        input_mapping:
          app-git: app-git

  - name: helm-lint
    plan:
      - in_parallel:
          steps:
            - get: app-git
              trigger: true
            - get: ci-shared
              passed: [set-self]
            - get: deployer-image
      - task: helm-lint
        image: deployer-image
        file: app-git/concourse/tasks/helm-lint.yml
        input_mapping:
          app-git: app-git

  - name: build-images
    plan:
      - in_parallel:
          steps:
            - get: app-git
              passed: [unit-test, helm-lint]
              trigger: true
            - get: ci-shared
              passed: [set-self]
            - get: builder-image
      - task: build-images
        image: builder-image
        file: app-git/concourse/tasks/build-images.yml
        input_mapping:
          app-git: app-git
          ci-shared: ci-shared
        params:
          GHCR_USERNAME: ((ghcr-credentials.username))
          GHCR_PASSWORD: ((ghcr-credentials.password))
          GHCR_OWNER: reactive-network
          GIT_BRANCH: master

  - name: deploy-ci
    serial_groups: [deploy]
    max_in_flight: 1
    plan:
      - in_parallel:
          steps:
            - get: app-git
              passed: [build-images]
              trigger: true
            - get: ci-shared
              passed: [set-self]
            - get: deployer-image
      - task: deploy
        timeout: 30m
        image: deployer-image
        file: app-git/concourse/tasks/backrest-deploy.yml
        input_mapping:
          app-git: app-git
        params:
          DEPLOY_SOURCE: ci
          KUBECONFIG_CONTENT: ((kubeconfig-prq))

  - name: release
    plan:
      - in_parallel:
          steps:
            - get: app-git-tags
              trigger: true
            - get: app-git-concourse
            - get: ci-shared
              passed: [set-self]
            - get: builder-image
      - task: release
        image: builder-image
        file: app-git-concourse/concourse/tasks/release.yml
        input_mapping:
          app-git: app-git-tags
          pipeline-src: app-git-concourse
          ci-shared: ci-shared
        params:
          GHCR_USERNAME: ((ghcr-credentials.username))
          GHCR_PASSWORD: ((ghcr-credentials.password))
          GHCR_OWNER: reactive-network
          GITHUB_TOKEN: ((github-access-token.password))
          GIT_BRANCH: master

  - name: release-manual
    plan:
      - in_parallel:
          steps:
            - get: app-git
              trigger: false
            - get: app-git-concourse
            - get: ci-shared
              passed: [set-self]
            - get: builder-image
      - task: bump-and-push-tag
        image: builder-image
        file: app-git-concourse/concourse/tasks/release-bump-tag.yml
        input_mapping: {app-git: app-git}
        output_mapping: {release-meta: release-meta}
        params:
          GITHUB_TOKEN: ((github-access-token.password))
      - task: release
        image: builder-image
        file: app-git-concourse/concourse/tasks/release-manual-release.yml
        input_mapping:
          app-git: app-git
          pipeline-src: app-git-concourse
          ci-shared: ci-shared
          release-meta: release-meta
        params:
          GHCR_USERNAME: ((ghcr-credentials.username))
          GHCR_PASSWORD: ((ghcr-credentials.password))
          GHCR_OWNER: reactive-network
          GITHUB_TOKEN: ((github-access-token.password))
          GIT_BRANCH: master
